# Runs on every push and pull request (once the project is on GitHub).
# Unit tests on the oldest supported and the newest Python, on Linux, Mac and Windows;
# JavaScript is syntax-checked.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        run: python -m pytest -q tests

  # The e2e smoke tests (tools/verifica.py --fumo: SMOKE) against the local Python server, in other browsers and systems.
  # webkit = the engine of Safari (on macOS only: the ubuntu webkit job duplicated it and hung in the install step). No Pyodide here: the engine of the site is tried by hand (see AGENTS.md, "Prestazioni e compatibilità").
  browser:
    name: browser (${{ matrix.os }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browser: chromium }
          - { os: ubuntu-latest, browser: firefox }
          - { os: windows-latest, browser: chromium }
          - { os: macos-latest, browser: webkit }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[test]" playwright
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Smoke tests
        run: python tools/verifica.py --browser ${{ matrix.browser }} --fumo
      - name: Print the logs of the failed tests (readable in the job log)
        if: failure()
        shell: bash
        run: |
          cat .verifica/ultimo.md | cut -c1-600
          # only the logs of the tests that failed (the others are in the artifact)
          for n in $(grep -o '^- FAIL [A-Za-z0-9_]*' .verifica/ultimo.md | awk '{print $3}'); do echo "===== $n"; tail -n 60 ".verifica/log/$n.log"; done
      - name: Logs of the failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verifica-${{ matrix.os }}-${{ matrix.browser }}
          path: .verifica/
          include-hidden-files: true
          if-no-files-found: ignore

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          # every script of the page; module-style files are checked as .mjs (new files are picked up by themselves)
          for f in mzlab/web/*.js; do
            b=$(basename "$f" .js)
            case "$b" in
              browser-worker|draw|sw) cp "$f" "/tmp/$b.mjs"; node --check "/tmp/$b.mjs" ;;
              *) node --check "$f" ;;
            esac
          done
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path("mzlab/web/index.html").read_text(encoding="utf-8")
          inline = re.findall(r"<script>(.*?)</script>", html, re.S)
          pathlib.Path("/tmp/inline.js").write_text("\n".join(inline), encoding="utf-8")
          PY
          # classic scripts share globals: check explore.js + inline together (no duplicate const)
          cat mzlab/web/explore.js /tmp/inline.js > /tmp/page.js && node --check /tmp/page.js
