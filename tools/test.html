<!DOCTYPE html>
<html>
<head>
<style>
  .wrapper {
    display: flex;
    background: #ccc;
    /* OLD CSS */
    /* width: 28px !important; max-width: 28px !important; height: 28px !important; overflow: hidden !important; border-radius: 4px; align-self: center; padding: 0 !important; margin: 0 !important; display: flex !important; align-items: center !important; justify-content: flex-start !important; */

    /* NEW CSS */
    width: 28px !important; max-width: 28px !important; height: 28px !important; overflow: hidden !important; border-radius: 4px; align-self: center; padding: 0 !important; margin: 0 !important; display: block !important;
  }
  .wrapper > button {
    /* OLD CSS */
    /* normal ketcher button has min-width: 32px padding: 2px */

    /* NEW CSS */
    width: 28px !important; height: 28px !important; padding: 0 !important; margin: 0 !important; border-radius: 4px; display: flex !important; align-items: center !important; justify-content: center !important;
    background: #167782;
    border: none;
  }
  .wrapper > button svg {
    /* OLD CSS */
    /* width: 16px !important; height: 16px !important; margin: 0 0 0 6px !important; flex-shrink: 0 !important; */
    
    /* NEW CSS */
    width: 16px !important; height: 16px !important; margin: 0 !important; flex-shrink: 0 !important;
    fill: white;
  }
  .wrapper > svg {
    /* NEW CSS */
    display: none !important;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <button>
      <svg viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" fill="white"/></svg>
      <kbd>Shift+Tab</kbd>
    </button>
    <svg viewBox="0 0 10 10"><path d="M0,0 L10,10" stroke="black"/></svg>
  </div>
</body>
</html>
