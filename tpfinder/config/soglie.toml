# Thresholds of the score. Edit with any text editor; the program reads this file at start.
# A criterion that cannot be evaluated (for example no blank in the experiment) is shown as
# "n/a" and does not count for or against the candidate.

[peak]
snr_min = 3.0              # signal-to-noise of the peak in the treated samples
min_points = 5             # scans above the baseline across the peak
smooth_points = 3          # light smoothing (1, 3 or 5)

[blank]
ratio_max = 0.20           # area in the blank / largest area in the treated samples

[t0]
ratio_max = 0.20           # area at time zero / largest area in the treated samples

[growth]
rising_fraction_min = 0.75 # fraction of steps going up until the maximum

[halogen]
tolerance = 0.40           # relative difference allowed between (M+2)/M observed and expected

[labels]
strong = 75                # score >= strong: "strong candidate"
possible = 50              # score >= possible: "possible candidate", below: "weak"
