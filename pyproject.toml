[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mzlab"
version = "0.1.0"
description = "mzLab: viewer for triple quadrupole and HRMS mzML data, runs in the browser (teaching lab, environmental pollutants)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["mzlab*", "qqq_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
